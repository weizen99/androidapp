今日盤中禁手與特情預警】\n\n1. **嚴禁開盤前 15 分鐘急拉追高標的**：因美股洗盤劇烈，台股開盤極易出現情緒性搓高或假突破，未達量化進場防守區間前，嚴禁任何市價追高行為。\n2. **主力成本破位出場紀律**：個股若盤中實體 K 棒帶量跌破「停損點位」（即主力防守堡壘），執行無條件機械化停損，絕不留戀或憑感覺抱單。\n3. **禁用與法人背離標的**：盤中凡遇外資/投信大舉賣超、但散戶融資大增之標的，一律列入禁買黑名單，嚴防主力拉高出貨陷阱。";
